<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        <style>
        body { font-family: Arial, sans-serif; background: #f2f4f8;
               display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: #fff; padding: 30px; border-radius: 8px;
               box-shadow: 0 2px 10px rgba(0,0,0,.1); width: 300px; }
        input { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2563eb; color: #fff;
                 border: 0; border-radius: 4px; cursor: pointer; }
        .error { color: red; font-size: 14px; }
    </style>
    </style>
</head>
<body>
    <div class="box">
        <h2>Login</h2>
        {% if form.errors %}
            <p class="error">Invalid username or password.</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label>Username</label>
            {{ form.username }}
            <label>Password</label>
            {{ form.password }}
            <button type="submit">Log in</button>
        </form>
    </div>
</body>
</html>
